name: Build Desktop Apps

on:
  release:
    types: [published]
  workflow_dispatch:

# Scope to the ref so a test build on a branch can never cancel an in-flight
# release build, and never cancel a release run at all.
concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  build:
    strategy:
      # One flaky platform must not stop the others -- see the `release` job,
      # which ships whatever did build.
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: linux
            rust-targets: x86_64-unknown-linux-gnu
            tauri-args: ""
            bundle-dir: src-tauri/target/release/bundle
          # A universal binary, so one .dmg covers Apple Silicon and Intel.
          # Note this moves the bundle output out of target/release/.
          - platform: macos-latest
            target: macos-universal
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: "--target universal-apple-darwin"
            bundle-dir: src-tauri/target/universal-apple-darwin/release/bundle
          - platform: windows-latest
            target: windows
            rust-targets: x86_64-pc-windows-msvc
            tauri-args: ""
            bundle-dir: src-tauri/target/release/bundle

    runs-on: ${{ matrix.platform }}
    # Backstop: a wedged apt mirror once burned the full 6h job limit before
    # anyone noticed. Fail in minutes instead.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Ensure cargo is in PATH
        shell: bash
        run: |
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> $GITHUB_PATH

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies (Linux)
        if: matrix.target == 'linux'
        # This step once ate the full 6h job limit. Two distinct causes:
        #
        #  - The runners' Azure apt mirror blackholes connections, so apt falls
        #    back to archive.ubuntu.com...
        #  - ...where it then stalls on the large Packages indices, because IPv6
        #    egress from Azure runners dribbles rather than failing. Acquire's
        #    Timeout is an *inactivity* timeout, so a slow blackhole never trips
        #    it -- ForceIPv4 is what actually fixes this.
        #
        # Belt and braces: `timeout` caps each attempt so a stall retries instead
        # of consuming the whole step budget, and the step itself is capped.
        timeout-minutes: 20
        run: |
          set -eu
          APT_OPTS="-o Acquire::ForceIPv4=true
                    -o Acquire::Retries=3
                    -o Acquire::http::Timeout=30
                    -o Acquire::https::Timeout=30
                    -o DPkg::Lock::Timeout=60"

          apt_retry() {
            for attempt in 1 2 3; do
              if sudo timeout 300 apt-get $APT_OPTS "$@"; then
                return 0
              fi
              echo "apt-get $1 failed or stalled (attempt $attempt of 3); retrying"
              sleep 10
            done
            return 1
          }

          # A partial `update` is often still enough to resolve what we need, so
          # only the install is allowed to fail the build.
          apt_retry update ||
            echo "::warning::apt-get update did not fully succeed; continuing anyway"

          apt_retry install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libayatana-appindicator3-dev ||
            {
              echo "::error::could not install Linux build dependencies"
              exit 1
            }

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Set version from release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "Setting version to $VERSION"
          # Update tauri.conf.json version
          bun -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = '$VERSION';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.tauri-args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # macOS only: prove the bundle really is validly signed before we ship it.
      # An .app carrying only the linker's ad-hoc signature (no _CodeSignature,
      # Info.plist not bound) makes macOS report "SLEAP is damaged and can't be
      # opened" -- a dead end with no "Open Anyway". `signingIdentity: "-"` in
      # tauri.conf.json is what prevents that, and this asserts it held.
      - name: Verify macOS code signature
        if: matrix.target == 'macos-universal'
        run: |
          set -eu
          APP="${{ matrix.bundle-dir }}/macos/SLEAP.app"
          codesign -dv --verbose=2 "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          if ! codesign -dv "$APP" 2>&1 | grep -q "Sealed Resources"; then
            echo "::error::SLEAP.app has no sealed resources -- the bundle was not signed"
            exit 1
          fi
          lipo -info "$APP/Contents/MacOS/sleap-app"

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          B="${{ matrix.bundle-dir }}"

          # Copy by extension rather than by hardcoded per-platform paths: the
          # bundle dir moves when --target is passed (as it is on macOS), and the
          # previous `cp ... || true` form would silently collect nothing.
          find "$B" -maxdepth 2 -type f \( \
            -name '*.dmg' \
            -o -name '*.deb' \
            -o -name '*.AppImage' \
            -o -name '*.msi' \
            -o -name '*-setup.exe' \
            -o -name '*.tar.gz' \
            -o -name '*.sig' \
            \) -exec cp {} artifacts/ \;

          ls -lh artifacts/
          count=$(find artifacts -type f | wc -l | tr -d '[:space:]')
          if [ "$count" -eq 0 ]; then
            echo "::error::no bundles found under $B -- did the bundle output path change?"
            exit 1
          fi
          echo "Collected $count file(s)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sleap-app-${{ matrix.target }}
          path: artifacts/*
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    # `always()` on purpose. With `needs: build` alone, one cancelled matrix leg
    # skipped this job entirely -- which is how release v0.1.1 ended up with zero
    # assets even though macOS and Windows had both built fine.
    if: ${{ always() && github.event_name == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts
          merge-multiple: true

      - name: Summarize artifacts
        run: |
          set -eu
          mkdir -p artifacts
          ls -lhR artifacts/ || true
          count=$(find artifacts -type f | wc -l | tr -d '[:space:]')
          if [ "$count" -eq 0 ]; then
            echo "::error::every platform build failed; nothing to attach to this release"
            exit 1
          fi
          for pattern in '*.dmg' '*-setup.exe' '*.msi' '*.deb' '*.AppImage'; do
            if find artifacts -name "$pattern" -type f | grep -q .; then
              echo "present: $pattern"
            else
              echo "::warning::this release has no $pattern (that platform's build did not succeed)"
            fi
          done

      - name: Generate update manifest (latest.json)
        env:
          TAG: ${{ github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
          REPO: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import datetime, glob, json, os

          tag = os.environ["TAG"]
          base = f'https://github.com/{os.environ["REPO"]}/releases/download/{tag}'

          # Tauri v2 updater keys are "{os}-{arch}". macOS ships one universal
          # bundle, so the same tarball serves both Apple Silicon and Intel.
          # Ordered by preference -- an later rule only fills a key still unset,
          # so NSIS wins over MSI deterministically.
          RULES = [
              (".app.tar.gz.sig", ["darwin-aarch64", "darwin-x86_64"]),
              ("-setup.exe.sig", ["windows-x86_64"]),
              (".msi.sig", ["windows-x86_64"]),
              (".AppImage.sig", ["linux-x86_64"]),
          ]

          platforms = {}
          for suffix, keys in RULES:
              for sig_path in sorted(glob.glob(f"artifacts/*{suffix}")):
                  artifact = os.path.basename(sig_path)[:-len(".sig")]
                  if not os.path.exists(os.path.join("artifacts", artifact)):
                      print(f"::warning::{artifact} is missing next to its .sig; skipping")
                      continue
                  with open(sig_path) as fh:
                      signature = fh.read().strip()
                  for key in keys:
                      platforms.setdefault(key, {
                          "signature": signature,
                          "url": f"{base}/{artifact}",
                      })

          if not platforms:
              raise SystemExit(
                  "::error::no signed updater artifacts found; refusing to write an "
                  "empty latest.json, which would break the in-app updater"
              )

          for key in ("darwin-aarch64", "darwin-x86_64", "windows-x86_64", "linux-x86_64"):
              if key not in platforms:
                  print(f"::warning::latest.json has no entry for {key}")

          manifest = {
              "version": tag.lstrip("v"),
              # Passed through the environment rather than interpolated into this
              # script, so quotes and newlines in the release body are harmless.
              "notes": os.environ.get("NOTES", ""),
              "pub_date": datetime.datetime.now(datetime.timezone.utc)
                  .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }

          with open("latest.json", "w") as fh:
              json.dump(manifest, fh, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload artifacts and manifest to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            artifacts/*
            latest.json
