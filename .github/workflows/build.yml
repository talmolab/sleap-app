name: Build Desktop Apps

on:
  workflow_dispatch:

# Cancel in-progress runs of the same workflow
concurrency:
  group: build-desktop
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: linux
          - platform: macos-latest
            target: macos-arm64
          - platform: windows-latest
            target: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libayatana-appindicator3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect artifacts (Linux)
        if: matrix.target == 'linux'
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/deb/*.deb artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage.sig artifacts/ 2>/dev/null || true

      - name: Collect artifacts (macOS)
        if: matrix.target == 'macos-arm64'
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/dmg/*.dmg artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/macos/*.tar.gz artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/macos/*.tar.gz.sig artifacts/ 2>/dev/null || true

      - name: Collect artifacts (Windows)
        if: matrix.target == 'windows'
        shell: bash
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/msi/*.msi artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/msi/*.msi.sig artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/nsis/*.exe artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/nsis/*.exe.sig artifacts/ 2>/dev/null || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sleap-app-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Delete existing dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev --repo ${{ github.repository }} --yes 2>/dev/null || true
          git push --delete origin dev 2>/dev/null || true

      - name: Create dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: "Dev Build"
          body: |
            Rolling development build from `main` branch.

            **Commit:** ${{ github.sha }}
            **Built:** ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            **Triggered by:** @${{ github.actor }}

            > This release is overwritten on each build. Only the latest artifacts are kept.
          prerelease: true
          files: artifacts/*
          make_latest: false

      - name: Generate update manifest (latest.json)
        run: |
          VERSION=$(cat artifacts/*.json 2>/dev/null | jq -r '.version' 2>/dev/null || echo "0.1.0")
          REPO="talmolab/sleap-app"
          TAG="dev"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          # Build platform entries from available .sig files
          cat > latest.json << 'MANIFEST_EOF'
          {
            "version": "REPLACE_VERSION",
            "notes": "Development build",
            "pub_date": "REPLACE_DATE",
            "platforms": {}
          }
          MANIFEST_EOF

          # Use Python to build the manifest properly
          python3 -c "
          import json, glob, os, datetime

          version = '${VERSION}'
          base = '${BASE}'
          platforms = {}

          # Map file patterns to Tauri platform identifiers
          mappings = {
              '.AppImage.sig': ('linux-x86_64', '.AppImage'),
              '.msi.sig': ('windows-x86_64', '.msi'),
              '.tar.gz.sig': ('darwin-aarch64', '.tar.gz'),
              '.exe.sig': ('windows-x86_64', '.exe'),
          }

          for sig_file in glob.glob('artifacts/*.sig'):
              name = os.path.basename(sig_file)
              with open(sig_file) as f:
                  signature = f.read().strip()
              for suffix, (platform, artifact_ext) in mappings.items():
                  if name.endswith(suffix):
                      artifact_name = name[:-4]  # remove .sig
                      platforms[platform] = {
                          'signature': signature,
                          'url': f'{base}/{artifact_name}'
                      }

          manifest = {
              'version': version,
              'notes': 'Development build',
              'pub_date': datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
              'platforms': platforms
          }

          with open('latest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          "

      - name: Upload update manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          files: latest.json
          make_latest: false
