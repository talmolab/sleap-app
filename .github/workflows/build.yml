name: Build Desktop Apps

on:
  release:
    types: [published]
  workflow_dispatch:

# Scoped to the ref, so a manual test build on a branch can never cancel an
# in-flight release build. On a release event github.ref is refs/tags/<tag>, and
# cancel-in-progress is false there, so two publishes of the same tag queue
# rather than killing each other. Two release runs were silently cancelled this
# way when the group was the constant "build-desktop".
concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  # Fails in seconds rather than after three cold Rust builds. The MSI bundler
  # parses the version as semver and requires any pre-release identifier to be
  # NUMERIC (it maps x.y.z-N onto the Windows four-part version x.y.z.N), so
  # "v0.1.2-rc1" would fail the Windows leg only, late, and quietly.
  validate:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the release tag is a bundler-safe version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          echo "tag=$RELEASE_TAG -> version=$VERSION"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$'; then
            echo "::error::tag '$RELEASE_TAG' yields version '$VERSION', which the MSI"\
                 "bundler will reject. Use X.Y.Z, or X.Y.Z-N with a NUMERIC"\
                 "pre-release identifier (v0.1.2-1, v0.1.2-2), not -rc1/-beta.1."
            exit 1
          fi

  build:
    needs: validate
    # `always()` so workflow_dispatch runs (where `validate` is skipped by its own
    # `if`) still build. A real validate FAILURE still stops the matrix, because
    # the result is then 'failure', not 'skipped'.
    if: ${{ always() && needs.validate.result != 'failure' }}
    strategy:
      # One flaky platform must not stop the others -- see the `release` job,
      # which ships whatever did build.
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: linux
            rust-targets: x86_64-unknown-linux-gnu
            # Tauri sidecar triple: the suffix `Command.sidecar("binaries/ffmpeg")`
            # resolves to. For --target builds it is that target (see macOS below).
            sidecar-triple: x86_64-unknown-linux-gnu
            tauri-args: ""
            bundle-dir: src-tauri/target/release/bundle
            job-timeout: 60
          # One universal binary, so a single .dmg covers Apple Silicon and Intel.
          # macos-latest is arm64-only, so without this Intel Macs get nothing
          # they can execute at all (Rosetta does not translate arm64 -> x86_64).
          # NOTE: passing --target moves the bundle output out of target/release/.
          - platform: macos-latest
            target: macos-universal
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            # --target universal-apple-darwin => sidecars must be a fat
            # `binaries/ffmpeg-universal-apple-darwin` (lipo of both arches).
            sidecar-triple: universal-apple-darwin
            tauri-args: "--target universal-apple-darwin"
            bundle-dir: src-tauri/target/universal-apple-darwin/release/bundle
            # Tauri notarizes the .app INSIDE its build step, emitting no progress
            # and honouring no timeout of ours. A team's first-ever submission gets
            # extra vetting from Apple: ours was Accepted (id 656c1f62), but only
            # after >47 min, so a 60 min job cap killed the runner mid-wait. Later
            # submissions are normally minutes. Generous cap + the notarytool
            # history check in docs/macos-code-signing.md beats guessing.
            job-timeout: 120
          - platform: windows-latest
            target: windows
            rust-targets: x86_64-pc-windows-msvc
            sidecar-triple: x86_64-pc-windows-msvc
            tauri-args: ""
            bundle-dir: src-tauri/target/release/bundle
            job-timeout: 60

    runs-on: ${{ matrix.platform }}
    # Backstop: a wedged apt mirror once burned the full 6h job limit before
    # anyone noticed. Fail in minutes instead. Per-platform, because only macOS
    # blocks on a third party -- see job-timeout in the matrix.
    timeout-minutes: ${{ matrix.job-timeout }}

    steps:
      # All action pins below are the smallest major that runs on Node 24; Node
      # 20 is being removed from the runners.
      - name: Checkout
        uses: actions/checkout@v5

      # install.ps1 can be neither run nor parsed on a non-Windows dev machine, so
      # without this it ships on trust: a syntax error breaks the documented Windows
      # install path while every other check stays green.
      #
      # Runs BEFORE the Rust toolchain and build on purpose. It needs neither, it
      # finishes in seconds, and -- learned the hard way on v0.1.2-1 -- a lint
      # placed after the build will throw away a Windows build that succeeded,
      # leaving the release with no Windows assets at all.
      - name: Check the Windows installer script
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install.ps1').Path, [ref] $null, [ref] $errors) | Out-Null
          if ($errors) {
            foreach ($e in $errors) {
              Write-Host "::error file=scripts/install.ps1,line=$($e.Extent.StartLineNumber)::$($e.Message)"
            }
            exit 1
          }
          Write-Host 'scripts/install.ps1 parses cleanly'

          # Smoke test: -Path with a nonexistent file must fail cleanly. It must
          # also fail *legibly* -- Write-Fail throws, so without a top-level catch
          # the user gets a raw PowerShell stack trace instead of the message.
          $out = (& pwsh -NoProfile -File scripts/install.ps1 -Path 'Z:\nope\missing.msi' 2>&1) | Out-String
          $rc = $LASTEXITCODE
          Write-Host "missing-file exit=$rc"
          Write-Host $out
          if ($rc -eq 0) {
            Write-Host '::error::-Path with a missing file exited 0'
            exit 1
          }
          if ($out -match 'Exception:' -or $out -match 'ScriptStackTrace') {
            Write-Host '::error::install.ps1 leaked a raw PowerShell exception; it should print a clean "Error: ..." line'
            exit 1
          }
          if ($out -notmatch 'No such file') {
            Write-Host '::error::install.ps1 did not report the missing file by name'
            exit 1
          }

          # GitHub's pwsh wrapper exits the step with $LASTEXITCODE, which is still
          # non-zero from the inner `pwsh` call above -- so a PASSING check would
          # fail the step. Reset it explicitly.
          exit 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Ensure cargo is in PATH
        shell: bash
        run: echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies (Linux)
        if: matrix.target == 'linux'
        # This step once ate the full 6h job limit. Two distinct causes:
        #
        #  - The runners' Azure apt mirror blackholes connections, so apt falls
        #    back to archive.ubuntu.com...
        #  - ...where it then stalls on the large Packages indices, because IPv6
        #    egress from Azure runners dribbles rather than failing. Acquire's
        #    Timeout is an *inactivity* timeout, so a slow blackhole never trips
        #    it -- ForceIPv4 is what actually fixes this.
        #
        # Belt and braces: `timeout` caps each attempt so a stall retries instead
        # of consuming the whole step budget, and the step itself is capped.
        # Worst case here is 3x300s + 3x300s + 30s of sleeps = 30.5 min, so the
        # step ceiling is set above that -- otherwise the later retries, which
        # are the ones most likely to succeed, could never run.
        timeout-minutes: 32
        run: |
          set -uo pipefail
          APT_OPTS="-o Acquire::ForceIPv4=true
                    -o Acquire::Retries=3
                    -o Acquire::http::Timeout=30
                    -o Acquire::https::Timeout=30
                    -o DPkg::Lock::Timeout=60"

          apt_retry() {
            for attempt in 1 2 3; do
              if sudo timeout 300 apt-get $APT_OPTS "$@"; then
                return 0
              fi
              echo "apt-get $1 failed or stalled (attempt $attempt of 3); retrying"
              sleep 10
            done
            return 1
          }

          # A partial `update` is often still enough to resolve what we need, so
          # only the install is allowed to fail the build.
          apt_retry update ||
            echo "::warning::apt-get update did not fully succeed; continuing anyway"

          apt_retry install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libayatana-appindicator3-dev ||
            {
              echo "::error::could not install Linux build dependencies"
              exit 1
            }

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Set version from release tag
        if: github.event_name == 'release'
        shell: bash
        # Passed through the environment, never interpolated into a script body:
        # a `"` or a newline in a tag or release body must not be able to become
        # code. (Interpolating the release body into `python3 -c` is exactly what
        # made release v0.1.1 ship zero assets.)
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          echo "Setting version to $VERSION"
          # tauri.conf.json drives every bundle filename and the version the
          # running app reports to the updater. package.json drives the Vite
          # `__APP_VERSION__` constant used in the window title, so patch both or
          # the title bar disagrees with the release.
          VERSION="$VERSION" bun -e "
            const fs = require('fs');
            for (const p of ['src-tauri/tauri.conf.json', 'package.json']) {
              const o = JSON.parse(fs.readFileSync(p, 'utf8'));
              o.version = process.env.VERSION;
              fs.writeFileSync(p, JSON.stringify(o, null, 2) + '\n');
            }
          "

      # Opt-in Developer ID signing. With these secrets set, the .app is signed
      # with a real Apple-issued certificate, notarized, and stapled, so a .dmg
      # downloaded in a browser opens with NO Gatekeeper prompt. Without them the
      # build still works, falling back to tauri.conf.json's ad-hoc identity.
      #
      # These are exported here rather than interpolated into the build step's
      # `env:` because GitHub renders an unset secret as an EMPTY STRING, and an
      # empty APPLE_SIGNING_IDENTITY does NOT fall back to the config -- Tauri
      # runs `codesign -s ""`, which fails the whole build (verified locally).
      # Setting them only once they are known non-empty avoids that.
      #
      # See docs/macos-code-signing.md for how to produce each value.
      - name: Configure macOS code signing
        if: matrix.target == 'macos-universal'
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [ -z "$CERT" ] || [ -z "$IDENTITY" ]; then
            echo "SLEAP_SIGNING_MODE=adhoc" >> "$GITHUB_ENV"
            echo "::notice::No Apple Developer ID secrets set -- signing ad-hoc." \
                 "The .dmg installs cleanly via scripts/install.sh, but a browser" \
                 "download will be gated by Gatekeeper. See docs/macos-code-signing.md."
            exit 0
          fi

          # Heredoc form: a base64 cert may wrap, and a multi-line value written as
          # KEY=VALUE would corrupt the env file.
          {
            echo "APPLE_CERTIFICATE<<__SLEAP_EOF__"
            printf '%s\n' "$CERT"
            echo "__SLEAP_EOF__"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
          } >> "$GITHUB_ENV"

          if [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM_ID" ]; then
            {
              echo "APPLE_ID=$NOTARY_APPLE_ID"
              echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
              echo "APPLE_TEAM_ID=$NOTARY_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "SLEAP_SIGNING_MODE=developer-id-notarized" >> "$GITHUB_ENV"
            echo "Developer ID signing + notarization enabled."
          else
            echo "SLEAP_SIGNING_MODE=developer-id" >> "$GITHUB_ENV"
            echo "::warning::Signing with a Developer ID but NOT notarizing --" \
                 "APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID must all three be set." \
                 "An un-notarized Developer ID build is still gated in a browser."
          fi

      # tauri.conf.json declares the ffmpeg/ffprobe sidecars as externalBin, so
      # `tauri build` panics unless binaries/ffmpeg-<triple> exist. They are
      # .gitignore'd (large, per-platform) and fetched here. The script asserts a
      # permissive H.264 encoder is present, failing the build if a source rots.
      - name: Vendor ffmpeg sidecars
        shell: bash
        run: bash scripts/fetch-ffmpeg.sh "${{ matrix.sidecar-triple }}"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.tauri-args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Tauri notarizes and staples the .app, then builds the .dmg around it. The
      # disk image itself is left un-notarized, and Gatekeeper assesses the image
      # too when a quarantined .dmg is opened -- so without this, a browser
      # download still gets a prompt even though the app inside is notarized.
      - name: Notarize and staple the .dmg
        if: matrix.target == 'macos-universal' && env.SLEAP_SIGNING_MODE == 'developer-id-notarized'
        shell: bash
        run: |
          set -euo pipefail
          B="${{ matrix.bundle-dir }}"
          DMG="$(find "$B/dmg" -maxdepth 1 -type f -name '*.dmg' ! -name 'rw.*' | head -1)"
          [ -n "$DMG" ] || { echo "::error::no .dmg found under $B/dmg"; exit 1; }
          echo "Notarizing $(basename "$DMG")"

          # --wait blocks on Apple's service, which is usually ~1-5 min but has no
          # SLA; the timeout keeps a bad day from eating the job budget.
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m

          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "Stapled $(basename "$DMG")"

      # macOS only, and the whole point of this workflow: prove all three shipped
      # macOS artifacts really carry a valid bundle signature BEFORE anything is
      # published. An .app carrying only the linker's ad-hoc signature (no
      # Contents/_CodeSignature, "Sealed Resources=none") makes macOS report
      # "SLEAP is damaged and can't be opened" -- a dead end with no "Open
      # Anyway", because Gatekeeper records no policy verdict to override.
      # `bundle.macOS.signingIdentity: "-"` in tauri.conf.json is what prevents
      # that; this asserts it actually held.
      - name: Verify macOS code signature
        if: matrix.target == 'macos-universal'
        shell: bash
        run: |
          set -euo pipefail
          B="${{ matrix.bundle-dir }}"
          [ -d "$B" ] || { echo "::error::bundle dir $B does not exist"; exit 1; }
          APP="$B/macos/SLEAP.app"
          [ -d "$APP" ] || { echo "::error::$APP does not exist"; exit 1; }

          assert_signed() {
            _what="$1"; _app="$2"; _strict="$3"
            # Capture once. `codesign -dv | grep -q` looks fine but grep exits on
            # the first match, codesign then dies of SIGPIPE, and `pipefail` turns
            # that into a failed pipeline -- a race that fails the build at random.
            _desc="$(codesign -dv --verbose=2 "$_app" 2>&1 || true)"
            echo "::group::codesign -dv ($_what)"
            printf '%s\n' "$_desc"
            echo "::endgroup::"
            if [ "$_strict" = strict ]; then
              codesign --verify --deep --strict --verbose=2 "$_app"
              # Without --arch, codesign checks only the host (arm64) slice, so
              # an Intel-slice regression would ship unnoticed.
              codesign --verify --deep --strict --arch x86_64 --verbose=2 "$_app"
              codesign --verify --deep --strict --arch arm64 --verbose=2 "$_app"
            else
              # The copy inside the .dmg is mutated after signing: tauri-action
              # sets TAURI_BUNDLER_DMG_IGNORE_CI=true, which re-enables
              # bundle_dmg.sh's Finder AppleScript (it sets the bundle's
              # kIsExtensionHidden FinderInfo). That detritus can trip --strict
              # while leaving the signature perfectly valid for launch, so verify
              # this copy without --strict and assert the seal separately.
              codesign --verify --deep --verbose=2 "$_app"
            fi
            # "Sealed Resources=none" CONTAINS the string "Sealed Resources", so
            # a bare match on that passes on the exact broken state this guard
            # exists to catch. Require the "version=" form.
            case "$_desc" in
              *"Sealed Resources version="*) ;;
              *) echo "::error::$_what reports 'Sealed Resources=none' -- the bundle was not signed"; exit 1 ;;
            esac
            # Which identity we expect depends on whether the Developer ID secrets
            # are configured. Asserting the mode both ways means a silently-dropped
            # certificate cannot quietly downgrade a release to ad-hoc.
            if [ "${SLEAP_SIGNING_MODE:-adhoc}" = adhoc ]; then
              case "$_desc" in
                *flags=*adhoc*) ;;
                *) echo "::error::$_what is not ad-hoc signed as configured"; exit 1 ;;
              esac
            else
              case "$_desc" in
                *flags=*adhoc*)
                  echo "::error::$_what is ad-hoc signed, but Developer ID secrets" \
                       "are configured -- the certificate did not take effect"
                  exit 1
                  ;;
              esac
              case "$_desc" in
                *"Authority=Developer ID Application:"*) ;;
                *) echo "::error::$_what has no Developer ID Application authority"; exit 1 ;;
              esac
              # Hardened runtime is mandatory for notarization to be accepted.
              case "$_desc" in
                *flags=*runtime*) ;;
                *) echo "::error::$_what was signed without the hardened runtime"; exit 1 ;;
              esac
            fi
            echo "ok: $_what carries a valid, sealed bundle signature"
          }

          # 1. The bundle the dmg and the updater tarball are both built FROM.
          test -d "$APP/Contents/_CodeSignature" \
            || { echo "::error::SLEAP.app has no Contents/_CodeSignature"; exit 1; }
          assert_signed "bundle-dir SLEAP.app" "$APP" strict

          # Both slices must actually be present, not just verifiable.
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/sleap-app")"
          echo "slices: $ARCHS"
          case "$ARCHS" in
            *x86_64*) ;;
            *) echo "::error::no x86_64 slice -- Intel Macs cannot run this build"; exit 1 ;;
          esac
          case "$ARCHS" in
            *arm64*) ;;
            *) echo "::error::no arm64 slice"; exit 1 ;;
          esac

          # 2. The .app a tester actually drags out of the .dmg.
          DMG="$(find "$B/dmg" -maxdepth 1 -type f -name '*.dmg' ! -name 'rw.*' | head -1)"
          [ -n "$DMG" ] || { echo "::error::no .dmg found under $B/dmg"; exit 1; }
          MNT="$(mktemp -d)"
          cleanup_mnt() { hdiutil detach "$MNT" -quiet 2>/dev/null || true; }
          trap cleanup_mnt EXIT
          hdiutil attach -nobrowse -noautoopen -readonly -quiet -mountpoint "$MNT" "$DMG"
          assert_signed "SLEAP.app inside $(basename "$DMG")" "$MNT/SLEAP.app" loose
          cleanup_mnt
          trap - EXIT

          # 3. The .app the in-app updater swaps in.
          TGZ="$B/macos/SLEAP.app.tar.gz"
          [ -f "$TGZ" ] || { echo "::error::$TGZ is missing"; exit 1; }
          TDIR="$(mktemp -d)"
          tar -xzf "$TGZ" -C "$TDIR"
          assert_signed "SLEAP.app extracted from SLEAP.app.tar.gz" "$TDIR/SLEAP.app" strict

          # 4. The end-to-end question no codesign invocation answers: would
          # Gatekeeper actually let a user open this? Only meaningful once the
          # build is notarized -- an ad-hoc build is expected to be rejected, and
          # that is exactly why scripts/install.sh exists.
          if [ "${SLEAP_SIGNING_MODE:-adhoc}" = developer-id-notarized ]; then
            echo "::group::spctl assessment"
            spctl -a -vvv -t exec "$APP"
            spctl -a -vvv -t open --context context:primary-signature "$DMG"
            echo "::endgroup::"
            # A notarized app must carry a stapled ticket, or a user who is offline
            # (or behind a firewall blocking Apple's OCSP) still gets prompted.
            xcrun stapler validate "$APP"
            echo "Notarized, stapled, and accepted by Gatekeeper."
          else
            echo "All three macOS artifacts carry a valid ad-hoc bundle signature."
            echo "::notice::This build is NOT notarized -- install it with" \
                 "scripts/install.sh, or clear com.apple.quarantine by hand."
          fi

      # A mismatched TAURI_SIGNING_PRIVATE_KEY is only a WARNING from the
      # bundler: the build goes green, the release looks perfect, and every
      # in-app update is rejected at runtime with an opaque signature error.
      # minisign embeds the 8-byte key id in both the public key and each
      # signature, so compare them directly.
      - name: Verify updater signatures match the configured public key
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, glob, json, os, sys

          def keyid(blob: str) -> str:
              line = next(l for l in blob.splitlines()
                          if l and not l.startswith(("untrusted", "trusted")))
              return base64.b64decode(line)[2:10][::-1].hex().upper()

          conf = json.load(open("src-tauri/tauri.conf.json"))
          want = keyid(base64.b64decode(conf["plugins"]["updater"]["pubkey"]).decode())
          print("configured pubkey key id:", want)

          sigs = sorted(glob.glob("src-tauri/target/**/release/bundle/**/*.sig",
                                  recursive=True))
          if not sigs:
              print("::warning::no .sig files produced; the in-app updater will "
                    "have nothing to verify")
              sys.exit(0)

          bad = []
          for p in sigs:
              got = keyid(base64.b64decode(open(p, "rb").read()).decode())
              print(f"  {os.path.basename(p)}: {got}")
              if got != want:
                  bad.append((p, got))
          if bad:
              for p, got in bad:
                  print(f"::error::{p} was signed with key id {got}, but "
                        f"plugins.updater.pubkey expects {want}; every update "
                        f"would be rejected at runtime")
              sys.exit(1)
          print("All updater signatures match the configured public key.")
          PY

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          # rm, not just mkdir: a stale artifacts/ in the checkout (it has been
          # committed by accident before) would be re-uploaded from every leg,
          # defeat the zero-count guard below, and attach an old build's files to
          # a new release -- including a valid-but-stale updater payload, which
          # the updater would happily install as a silent downgrade.
          rm -rf artifacts
          mkdir -p artifacts
          B="${{ matrix.bundle-dir }}"
          [ -d "$B" ] || { echo "::error::bundle dir $B does not exist -- did the output path change?"; exit 1; }

          # Copy by extension rather than by hardcoded per-platform paths: the
          # bundle dir moves when --target is passed (as it is on macOS), and the
          # previous `cp ... || true` form silently collected nothing.
          # `! -name 'rw.*'` skips create-dmg's read-write intermediate
          # (rw.<pid>.SLEAP_<ver>_universal.dmg), which lives in the same
          # directory and survives a failed dmg finalize.
          find "$B" -maxdepth 2 -type f ! -name 'rw.*' \( \
            -name '*.dmg' \
            -o -name '*.deb' \
            -o -name '*.rpm' \
            -o -name '*.AppImage' \
            -o -name '*.msi' \
            -o -name '*-setup.exe' \
            -o -name '*.tar.gz' \
            -o -name '*.sig' \
            \) -exec cp {} artifacts/ \;

          ls -lh artifacts/
          count="$(find artifacts -type f | wc -l | tr -d '[:space:]')"
          if [ "$count" -eq 0 ]; then
            echo "::error::no bundles found under $B -- did the bundle output path change?"
            exit 1
          fi
          echo "Collected $count file(s)"

      # macOS gets its own human-readable name for this one: it's the only
      # platform where the file a person actually double-clicks (.dmg) and
      # the file Tauri's updater consumes (.app.tar.gz, next step) differ --
      # "-dmg" says what it is without requiring "universal" (arch jargon) to
      # make sense of it. Windows/Linux keep the plain sleap-app-<target>
      # name, since there's nothing to disambiguate there.
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target == 'macos-universal' && 'sleap-app-macos-dmg' || format('sleap-app-{0}', matrix.target) }}
          path: |
            artifacts/*
            !artifacts/*.tar.gz
            !artifacts/*.tar.gz.sig
          retention-days: 7
          if-no-files-found: error

      # macOS's createUpdaterArtifacts also produces SLEAP.app.tar.gz -- a full
      # second copy of the app in an extractable format the in-app updater
      # needs, alongside the .dmg a human actually double-clicks. Bundling
      # both into one artifact zip roughly doubled its size for anyone who
      # only wanted one of the two (#345). Split out into its own artifact,
      # named the same plain sleap-app-<target> way every other platform's
      # single artifact already is -- this IS the real cross-platform build
      # output (what Tauri's updater actually ships), the .dmg above is the
      # one-time-install extra. `ignore` rather than `error` since
      # Windows/Linux don't produce this format at all today -- when they
      # match zero files, this step uploads nothing under this name, so it
      # never collides with their own (differently-named) installer artifact.
      - name: Upload updater artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sleap-app-${{ matrix.target }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sig
          retention-days: 7
          if-no-files-found: ignore

  release:
    needs: build
    # `!cancelled()` on purpose, and NOT `always()`:
    #  - with a bare `needs: build`, one failed or cancelled matrix leg skipped
    #    this job entirely, which is how release v0.1.1 got zero assets;
    #  - `always()` would also publish a half-built release from a run someone
    #    cancelled by hand, which is worse than shipping nothing.
    if: ${{ !cancelled() && github.event_name == 'release' && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          path: artifacts
          merge-multiple: true

      - name: Summarize artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ls -lhR artifacts/ || true
          count="$(find artifacts -type f | wc -l | tr -d '[:space:]')"
          if [ "$count" -eq 0 ]; then
            echo "::error::every platform build failed; nothing to attach to this release"
            exit 1
          fi
          {
            echo "### Release assets"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          missing=0
          for pattern in '*_universal.dmg' '*-setup.exe' '*.msi' '*.deb' '*.AppImage'; do
            if find artifacts -name "$pattern" -type f | grep -q .; then
              echo "- ok \`$pattern\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- **MISSING** \`$pattern\`" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::this release has no $pattern (that platform's build did not succeed)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "MISSING_PLATFORM=1" >> "$GITHUB_ENV"
          fi

      # Binaries go up BEFORE the manifest is generated. Manifest generation used
      # to run first, and when it threw the upload step never ran -- a release
      # with zero assets caused by a bug in a file nothing installs.
      - name: Upload binaries to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: artifacts/*

      - name: Generate update manifest (latest.json)
        env:
          TAG: ${{ github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import datetime, glob, json, os, re

          tag = os.environ["TAG"]
          base = f'https://github.com/{os.environ["REPO"]}/releases/download/{tag}'

          # Keys are exactly what tauri-plugin-updater 2.10.1 looks up:
          # updater_os() x updater_arch() gives "{os}-{arch}", and get_urls()
          # tries "{os}-{arch}-{installer}" FIRST, then "{os}-{arch}"
          # (src/updater.rs:578-586). Installer names are app/msi/nsis/appimage/
          # deb/rpm (src/updater.rs:59-68). There is NO "darwin-universal" key --
          # each slice of a universal binary reports its own arch at runtime, so
          # the one universal tarball must be registered under BOTH darwin keys.
          #
          # Ordered by preference. A later rule only fills a key still unset, so
          # NSIS deterministically beats MSI for the bare windows-x86_64 fallback
          # (previously a glob-order coin flip). Both .tar.gz and bare forms are
          # listed for Windows/Linux so this is correct whether
          # createUpdaterArtifacts is `true` (current: the installer itself is
          # the payload, verified against real CI output) or "v1Compatible"
          # (which additionally emits .nsis.zip / .AppImage.tar.gz).
          RULES = [
              (".app.tar.gz.sig",        ["darwin-aarch64-app", "darwin-x86_64-app",
                                          "darwin-aarch64", "darwin-x86_64"]),
              ("-setup.nsis.zip.sig",    ["windows-x86_64-nsis", "windows-x86_64"]),
              ("-setup.exe.sig",         ["windows-x86_64-nsis", "windows-x86_64"]),
              (".msi.zip.sig",           ["windows-x86_64-msi", "windows-x86_64"]),
              (".msi.sig",               ["windows-x86_64-msi", "windows-x86_64"]),
              (".AppImage.tar.gz.sig",   ["linux-x86_64-appimage", "linux-x86_64"]),
              (".AppImage.sig",          ["linux-x86_64-appimage", "linux-x86_64"]),
              (".deb.sig",               ["linux-x86_64-deb"]),
              (".rpm.sig",               ["linux-x86_64-rpm"]),
          ]

          platforms = {}
          for suffix, keys in RULES:
              for sig_path in sorted(glob.glob(f"artifacts/*{suffix}")):
                  artifact = os.path.basename(sig_path)[: -len(".sig")]
                  if not os.path.exists(os.path.join("artifacts", artifact)):
                      print(f"::warning::{artifact} is missing next to its .sig; skipping")
                      continue
                  with open(sig_path) as fh:
                      signature = fh.read().strip()
                  for key in keys:
                      platforms.setdefault(key, {
                          "signature": signature,
                          "url": f"{base}/{artifact}",
                      })

          if not platforms:
              raise SystemExit(
                  "::error::no signed updater artifacts found; refusing to write an "
                  "empty latest.json, which would break the in-app updater"
              )

          for key in ("darwin-aarch64", "darwin-x86_64", "windows-x86_64", "linux-x86_64"):
              if key not in platforms:
                  print(f"::warning::latest.json has no entry for {key}; that "
                        f"platform will not receive updates from this release")

          manifest = {
              # Must equal the version the running app reports, i.e. the version
              # written into tauri.conf.json above: strip ONE leading "v".
              "version": re.sub(r"^v", "", tag),
              # From the environment, never interpolated: quotes and newlines in
              # a release body are ordinary data here.
              "notes": os.environ.get("NOTES", ""),
              "pub_date": datetime.datetime.now(datetime.timezone.utc)
                  .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }

          with open("latest.json", "w") as fh:
              json.dump(manifest, fh, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload the update manifest to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: latest.json

      # The updater endpoint resolves to /releases/latest, so a release missing a
      # platform silently disables updates for every existing install on it.
      # Say so loudly at the end, once the assets are already safely attached.
      - name: Fail loudly if this release is incomplete
        if: ${{ env.MISSING_PLATFORM == '1' }}
        run: |
          echo "::error::this release is missing at least one platform's installer;"\
               "see the warnings above. The assets that did build are attached."
          exit 1
