name: Build Dev Channel

# Nightly desktop builds off `main`, for the in-app "dev" update channel.
# macOS is Developer ID signed + notarized, same as build.yml's release
# pipeline (see the "Configure macOS code signing" step) -- so a downloaded
# .dmg opens normally without Gatekeeper overrides (#343). Windows/Linux stay
# unsigned. Publishes to a single rolling `dev` pre-release instead of a
# per-version tag -- see the `publish` job.
#
# Runs on a nightly schedule (not per-push -- a full 3-platform native build
# on every merge is expensive, especially macOS runners' 10x-per-minute
# billing multiplier) plus workflow_dispatch for an on-demand build. The
# `meta` job's should_build check skips the (expensive) build+publish jobs
# entirely when `main` hasn't moved since the last dev build -- a scheduled
# run on a quiet day is nearly free. workflow_dispatch always forces a build
# regardless, for testing the pipeline itself.
on:
  schedule:
    - cron: "0 0 * * *" # 00:00 UTC daily
  workflow_dispatch:

# A newer run supersedes an in-flight dev build -- there's no reason to
# finish building a commit `main` has already moved past.
concurrency:
  group: build-dev
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  # Decides whether this run should actually build anything, and computes the
  # one version string every matrix leg and the publish job need to agree on.
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.compute.outputs.version }}
      short_sha: ${{ steps.compute.outputs.short_sha }}
      should_build: ${{ steps.should_build.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Compares against the exact commit the LAST dev build actually used
      # (the `dev` tag, which the publish job below pins via
      # `--target` precisely so this comparison is reliable) rather than a
      # rolling time window -- robust to a delayed/queued scheduled run, a
      # paused-then-resumed schedule, or a prior build that failed and needs
      # a retry on the same commit. workflow_dispatch always builds: it's the
      # "give me a fresh dev build right now" escape hatch, e.g. for testing
      # this pipeline after a workflow-only change with no app code change.
      - name: Decide whether main has moved since the last dev build
        id: should_build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Manual trigger -- building regardless of whether main moved."
            exit 0
          fi
          LAST_SHA="$(gh api "repos/$REPO/git/ref/tags/dev" --jq .object.sha 2>/dev/null || true)"
          if [ -z "$LAST_SHA" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "No prior dev tag found -- building."
          elif [ "$LAST_SHA" = "${{ github.sha }}" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "main is unchanged since the last dev build ($LAST_SHA) -- skipping."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "main has moved ($LAST_SHA -> ${{ github.sha }}) -- building."
          fi

      - name: Compute the dev build's version
        id: compute
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # BASE is the HIGHEST-precedence version tag actually published on
          # GitHub (release OR pre-release, drafts excluded), reused VERBATIM
          # -- NOT `package.json`'s committed version. package.json is never
          # updated on `main` by the real release pipeline (build.yml only
          # patches it inside its own ephemeral, unpushed CI checkout when
          # stamping a release build), so it silently drifts arbitrarily far
          # behind actual shipped versions. Deriving from real tags instead is
          # self-correcting: it reflects whatever has ACTUALLY shipped, with
          # no dependency on anyone remembering to bump a committed file. A
          # real release outranks a pre-release of the same base (semver:
          # "1.0.0" > "1.0.0-1"), which the sort key below encodes explicitly.
          #
          # Yields the TAG rather than the bare version: the commit count
          # below has to compare against the real ref name, so strip the
          # optional "v" afterwards instead of inside the jq.
          BASE_TAG="$(gh api "repos/$REPO/releases?per_page=100" --paginate \
            --jq '[.[] | select(.draft == false) | .tag_name as $t
                   | ($t | capture("^v?(?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)(-(?<pre>[0-9]+))?$"))?
                   | select(. != null)
                   | {sortkey: [(.major|tonumber), (.minor|tonumber), (.patch|tonumber),
                                (if .pre == null then 1 else 0 end), (.pre // "0" | tonumber)],
                      tag: $t}]
                  | max_by(.sortkey) | if . == null then null else .tag end')"
          if [ -n "$BASE_TAG" ] && [ "$BASE_TAG" != "null" ]; then
            BASE="${BASE_TAG#v}"
          else
            # Defensive fallback (e.g. a brand-new repo with no version-tagged
            # releases yet) -- package.json's committed version is at least a
            # starting point, even though it can't be trusted to track reality.
            BASE_TAG=""
            BASE="$(python3 -c "import json; print(json.load(open('package.json'))['version'])")"
            echo "No valid version-tagged releases found on GitHub; falling back to package.json's $BASE"
          fi

          SHORT_SHA="$(printf '%s' "${{ github.sha }}" | cut -c1-7)"

          # COUNT is how far `main` has advanced past BASE_TAG, `git
          # describe` style -- a counter that RESTARTS at every new release
          # (stable or pre-release), so a dev build cut just after v0.1.3 is
          # "0.1.3+1.abc1234", not "0.1.3+<some four-digit repo-lifetime run
          # number>.abc1234". It was `github.run_number` before, which is
          # per-workflow-file and monotonic for the repo's whole lifetime, so
          # it never restarted and drifted arbitrarily far from anything
          # meaningful about the build it labelled.
          #
          # Derived, not stored: no counter lives anywhere: this is a property
          # of the commit graph, so it cannot drift, and there is nothing to
          # reset by hand when a release is cut. `ahead_by` is a true total,
          # NOT capped by the compare endpoint's 250-commit `commits[]` page
          # limit (checked against a 287-commit range).
          #
          # COUNT can legitimately be 0 -- a release tagged at `main`'s head,
          # then a workflow_dispatch build before the next merge. That is
          # valid semver build metadata and orders correctly: "+0" still sorts
          # above the plain tag (as any dev build does over its own base) and
          # below "+1", and a base bump still dominates a higher count on the
          # old base ("0.1.2-2+9" < "0.1.3+0"), which is what makes restarting
          # the counter safe for clients in the first place. All four checked
          # against the Cargo.lock-pinned semver crate.
          #
          # No silent fallback to run_number when the count fails: mixing the
          # two scales would emit e.g. "+2" right after a "+52" and strand
          # every client sitting on the higher number (the updater only
          # offers a STRICTLY greater version -- see should_offer_update in
          # src-tauri/src/update_channels.rs). `set -e` plus the numeric
          # guard turns that into a loud build failure instead. The only
          # exception is the no-releases-at-all case above, where BASE itself
          # is already a guess and there are no clients to strand.
          if [ -n "$BASE_TAG" ]; then
            COUNT="$(gh api "repos/$REPO/compare/${BASE_TAG}...${{ github.sha }}" --jq .ahead_by)"
            case "$COUNT" in
              "" | *[!0-9]*)
                echo "::error::Commits-since-$BASE_TAG count was '$COUNT', not a number; refusing to stamp an unorderable dev version."
                exit 1
                ;;
            esac
            echo "main is $COUNT commit(s) past $BASE_TAG"
          else
            COUNT="${{ github.run_number }}"
            echo "No base tag to count from; falling back to run_number $COUNT"
          fi

          # Build metadata ("+...") can hold multiple DOT-separated
          # identifiers (only ONE "+" is valid in semver at all -- everything
          # after it is one field). Order inside it is load-bearing: verified
          # directly against the `semver` crate update_channels.rs and
          # Tauri's own updater use (Cargo.lock-pinned version) that build
          # metadata identifiers compare numerically-if-purely-numeric, same
          # as pre-release identifiers, in the order given -- so putting the
          # numeric "<count>" FIRST makes it the deciding factor between any
          # two dev builds sharing the same BASE (e.g. "+8.1a2b3c4" >
          # "+7.9f8e7d6" correctly, even though "9f8e7d6" > "1a2b3c4" as a
          # raw string). The short SHA comes second, purely as human-readable
          # commit provenance -- it never actually gets consulted for
          # ordering, since two dev builds of the same BASE can only tie on
          # <count> by being the same commit (`main` is protected and
          # linear, so every commit past BASE_TAG increments it). Reversing
          # this order would silently break ordering between dev builds
          # again. <count> must stay numeric-only, same constraint as any
          # semver identifier compared numerically here.
          #
          # Consequence of counting COMMITS rather than BUILDS: re-running
          # this workflow on an unchanged `main` (workflow_dispatch) now
          # reproduces the identical version string instead of taking a fresh
          # run number, so clients already on it are offered nothing until
          # `main` moves. That is the intended trade -- same source, same
          # version -- and it self-heals on the next merge.
          VERSION="${BASE}+${COUNT}.${SHORT_SHA}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Dev build version: $VERSION (base tag ${BASE_TAG:-none}; commit $SHORT_SHA)"

  # Mirrors build.yml's `build` job matrix/steps, minus the install.ps1 lint
  # (release-only concern). macOS Developer ID signing + notarization IS
  # included here too -- see the workflow comment above and #343.
  build:
    needs: meta
    if: needs.meta.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: linux
            os-tag: linux
            rust-targets: x86_64-unknown-linux-gnu
            # Tauri sidecar triple: the suffix `Command.sidecar("binaries/ffmpeg")`
            # resolves to. For --target builds it is that target (see macOS below).
            sidecar-triple: x86_64-unknown-linux-gnu
            tauri-args: ""
            bundle-dir: src-tauri/target/release/bundle
            job-timeout: 60
          - platform: macos-latest
            target: macos-universal
            os-tag: macos
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            # --target universal-apple-darwin => sidecars must be a fat
            # `binaries/ffmpeg-universal-apple-darwin` (lipo of both arches).
            sidecar-triple: universal-apple-darwin
            tauri-args: "--target universal-apple-darwin"
            bundle-dir: src-tauri/target/universal-apple-darwin/release/bundle
            # Tauri notarizes the .app INSIDE its build step, emitting no
            # progress and honouring no timeout of ours -- same reasoning as
            # build.yml's identical job-timeout (a first-ever submission took
            # >47 min there; later ones are normally minutes, but Apple gives
            # no SLA).
            job-timeout: 120
          - platform: windows-latest
            target: windows
            os-tag: windows
            rust-targets: x86_64-pc-windows-msvc
            sidecar-triple: x86_64-pc-windows-msvc
            # NSIS only: the version string below is `+<count>.<short_sha>`,
            # and WiX/MSI requires build metadata to be numeric-only (see
            # tauri-apps/tauri discussion #7600) -- a hex git SHA can never
            # satisfy that, so `tauri build`'s MSI bundler fails every dev
            # build. NSIS has no such constraint. build.yml's real releases use
            # clean semver tags with no hex metadata, so they never hit this
            # and keep shipping both MSI+NSIS.
            tauri-args: "--bundles nsis"
            bundle-dir: src-tauri/target/release/bundle
            job-timeout: 60

    runs-on: ${{ matrix.platform }}
    timeout-minutes: ${{ matrix.job-timeout }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Ensure cargo is in PATH
        shell: bash
        run: echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies (Linux)
        if: matrix.target == 'linux'
        timeout-minutes: 32
        run: |
          set -uo pipefail
          APT_OPTS="-o Acquire::ForceIPv4=true
                    -o Acquire::Retries=3
                    -o Acquire::http::Timeout=30
                    -o Acquire::https::Timeout=30
                    -o DPkg::Lock::Timeout=60"

          apt_retry() {
            for attempt in 1 2 3; do
              if sudo timeout 300 apt-get $APT_OPTS "$@"; then
                return 0
              fi
              echo "apt-get $1 failed or stalled (attempt $attempt of 3); retrying"
              sleep 10
            done
            return 1
          }

          apt_retry update ||
            echo "::warning::apt-get update did not fully succeed; continuing anyway"

          apt_retry install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libayatana-appindicator3-dev ||
            {
              echo "::error::could not install Linux build dependencies"
              exit 1
            }

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Set version for this dev build
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          echo "Setting version to $VERSION"
          # See build.yml's "Set version from release tag" -- same reason both
          # files need patching: tauri.conf.json drives bundle filenames + the
          # version the in-app updater reports; package.json drives the window
          # title's __APP_VERSION__ constant.
          VERSION="$VERSION" bun -e "
            const fs = require('fs');
            for (const p of ['src-tauri/tauri.conf.json', 'package.json']) {
              const o = JSON.parse(fs.readFileSync(p, 'utf8'));
              o.version = process.env.VERSION;
              fs.writeFileSync(p, JSON.stringify(o, null, 2) + '\n');
            }
          "

      # Same secrets build.yml uses for real releases, reused here so a dev
      # .dmg downloaded from the GitHub `dev` pre-release opens normally
      # without Gatekeeper overrides (#343). Unlike build.yml's version of
      # this step, this FAILS rather than silently falling back to ad-hoc:
      # build.yml treats a release as a rare, human-triggered event a
      # maintainer would notice a downgrade on, but this runs unattended on a
      # nightly schedule -- a silently-ad-hoc dev build would go unnoticed
      # until a tester hit the exact Gatekeeper block this fix exists to avoid.
      - name: Configure macOS code signing
        if: matrix.target == 'macos-universal'
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [ -z "$CERT" ] || [ -z "$IDENTITY" ]; then
            echo "::error::No Apple Developer ID secrets configured" \
                 "(APPLE_CERTIFICATE/APPLE_SIGNING_IDENTITY) -- refusing to" \
                 "silently publish an ad-hoc-signed dev build. See #343."
            exit 1
          fi
          if [ -z "$NOTARY_APPLE_ID" ] || [ -z "$NOTARY_PASSWORD" ] || [ -z "$NOTARY_TEAM_ID" ]; then
            echo "::error::Developer ID certificate is configured, but" \
                 "notarization credentials (APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID)" \
                 "are missing or incomplete -- refusing to publish a" \
                 "signed-but-unnotarized dev build. See #343."
            exit 1
          fi

          # Heredoc form: a base64 cert may wrap, and a multi-line value written as
          # KEY=VALUE would corrupt the env file.
          {
            echo "APPLE_CERTIFICATE<<__SLEAP_EOF__"
            printf '%s\n' "$CERT"
            echo "__SLEAP_EOF__"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_ID=$NOTARY_APPLE_ID"
            echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
            echo "APPLE_TEAM_ID=$NOTARY_TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "SLEAP_SIGNING_MODE=developer-id-notarized" >> "$GITHUB_ENV"
          echo "Developer ID signing + notarization enabled."

      # tauri.conf.json declares the ffmpeg/ffprobe sidecars as externalBin, so
      # `tauri build` panics unless binaries/ffmpeg-<triple> exist. They are
      # .gitignore'd (large, per-platform) and fetched here. The script asserts a
      # permissive H.264 encoder is present, failing the build if a source rots.
      - name: Vendor ffmpeg sidecars
        shell: bash
        run: bash scripts/fetch-ffmpeg.sh "${{ matrix.sidecar-triple }}"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.tauri-args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Tauri notarizes and staples the .app, then builds the .dmg around it. The
      # disk image itself is left un-notarized, and Gatekeeper assesses the image
      # too when a quarantined .dmg is opened -- so without this, a browser
      # download still gets a prompt even though the app inside is notarized.
      - name: Notarize and staple the .dmg
        if: matrix.target == 'macos-universal' && env.SLEAP_SIGNING_MODE == 'developer-id-notarized'
        shell: bash
        run: |
          set -euo pipefail
          B="${{ matrix.bundle-dir }}"
          DMG="$(find "$B/dmg" -maxdepth 1 -type f -name '*.dmg' ! -name 'rw.*' | head -1)"
          [ -n "$DMG" ] || { echo "::error::no .dmg found under $B/dmg"; exit 1; }
          echo "Notarizing $(basename "$DMG")"

          # --wait blocks on Apple's service, which is usually ~1-5 min but has no
          # SLA; the timeout keeps a bad day from eating the job budget.
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m

          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "Stapled $(basename "$DMG")"

      # macOS only, and the whole point of this workflow: prove all three shipped
      # macOS artifacts really carry a valid bundle signature BEFORE anything is
      # published. An .app carrying only the linker's ad-hoc signature (no
      # Contents/_CodeSignature, "Sealed Resources=none") makes macOS report
      # "SLEAP is damaged and can't be opened" -- a dead end with no "Open
      # Anyway", because Gatekeeper records no policy verdict to override.
      # `bundle.macOS.signingIdentity: "-"` in tauri.conf.json is what prevents
      # that; this asserts it actually held. Same dual-mode check as build.yml --
      # kept generic rather than assuming developer-id-notarized always wins,
      # even though Configure macOS code signing's fail-closed guard means that
      # should be the only mode this ever actually sees.
      - name: Verify macOS code signature
        if: matrix.target == 'macos-universal'
        shell: bash
        run: |
          set -euo pipefail
          B="${{ matrix.bundle-dir }}"
          [ -d "$B" ] || { echo "::error::bundle dir $B does not exist"; exit 1; }
          APP="$B/macos/SLEAP.app"
          [ -d "$APP" ] || { echo "::error::$APP does not exist"; exit 1; }

          assert_signed() {
            _what="$1"; _app="$2"; _strict="$3"
            # Capture once. `codesign -dv | grep -q` looks fine but grep exits on
            # the first match, codesign then dies of SIGPIPE, and `pipefail` turns
            # that into a failed pipeline -- a race that fails the build at random.
            _desc="$(codesign -dv --verbose=2 "$_app" 2>&1 || true)"
            echo "::group::codesign -dv ($_what)"
            printf '%s\n' "$_desc"
            echo "::endgroup::"
            if [ "$_strict" = strict ]; then
              codesign --verify --deep --strict --verbose=2 "$_app"
              # Without --arch, codesign checks only the host (arm64) slice, so
              # an Intel-slice regression would ship unnoticed.
              codesign --verify --deep --strict --arch x86_64 --verbose=2 "$_app"
              codesign --verify --deep --strict --arch arm64 --verbose=2 "$_app"
            else
              # The copy inside the .dmg is mutated after signing: tauri-action
              # sets TAURI_BUNDLER_DMG_IGNORE_CI=true, which re-enables
              # bundle_dmg.sh's Finder AppleScript (it sets the bundle's
              # kIsExtensionHidden FinderInfo). That detritus can trip --strict
              # while leaving the signature perfectly valid for launch, so verify
              # this copy without --strict and assert the seal separately.
              codesign --verify --deep --verbose=2 "$_app"
            fi
            # "Sealed Resources=none" CONTAINS the string "Sealed Resources", so
            # a bare match on that passes on the exact broken state this guard
            # exists to catch. Require the "version=" form.
            case "$_desc" in
              *"Sealed Resources version="*) ;;
              *) echo "::error::$_what reports 'Sealed Resources=none' -- the bundle was not signed"; exit 1 ;;
            esac
            # Which identity we expect depends on whether the Developer ID secrets
            # are configured. Asserting the mode both ways means a silently-dropped
            # certificate cannot quietly downgrade a release to ad-hoc.
            if [ "${SLEAP_SIGNING_MODE:-adhoc}" = adhoc ]; then
              case "$_desc" in
                *flags=*adhoc*) ;;
                *) echo "::error::$_what is not ad-hoc signed as configured"; exit 1 ;;
              esac
            else
              case "$_desc" in
                *flags=*adhoc*)
                  echo "::error::$_what is ad-hoc signed, but Developer ID secrets" \
                       "are configured -- the certificate did not take effect"
                  exit 1
                  ;;
              esac
              case "$_desc" in
                *"Authority=Developer ID Application:"*) ;;
                *) echo "::error::$_what has no Developer ID Application authority"; exit 1 ;;
              esac
              # Hardened runtime is mandatory for notarization to be accepted.
              case "$_desc" in
                *flags=*runtime*) ;;
                *) echo "::error::$_what was signed without the hardened runtime"; exit 1 ;;
              esac
            fi
            echo "ok: $_what carries a valid, sealed bundle signature"
          }

          # 1. The bundle the dmg and the updater tarball are both built FROM.
          test -d "$APP/Contents/_CodeSignature" \
            || { echo "::error::SLEAP.app has no Contents/_CodeSignature"; exit 1; }
          assert_signed "bundle-dir SLEAP.app" "$APP" strict

          # Both slices must actually be present, not just verifiable.
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/sleap-app")"
          echo "slices: $ARCHS"
          case "$ARCHS" in
            *x86_64*) ;;
            *) echo "::error::no x86_64 slice -- Intel Macs cannot run this build"; exit 1 ;;
          esac
          case "$ARCHS" in
            *arm64*) ;;
            *) echo "::error::no arm64 slice"; exit 1 ;;
          esac

          # 2. The .app a tester actually drags out of the .dmg.
          DMG="$(find "$B/dmg" -maxdepth 1 -type f -name '*.dmg' ! -name 'rw.*' | head -1)"
          [ -n "$DMG" ] || { echo "::error::no .dmg found under $B/dmg"; exit 1; }
          MNT="$(mktemp -d)"
          cleanup_mnt() { hdiutil detach "$MNT" -quiet 2>/dev/null || true; }
          trap cleanup_mnt EXIT
          hdiutil attach -nobrowse -noautoopen -readonly -quiet -mountpoint "$MNT" "$DMG"
          assert_signed "SLEAP.app inside $(basename "$DMG")" "$MNT/SLEAP.app" loose
          cleanup_mnt
          trap - EXIT

          # 3. The .app the in-app updater swaps in.
          TGZ="$B/macos/SLEAP.app.tar.gz"
          [ -f "$TGZ" ] || { echo "::error::$TGZ is missing"; exit 1; }
          TDIR="$(mktemp -d)"
          tar -xzf "$TGZ" -C "$TDIR"
          assert_signed "SLEAP.app extracted from SLEAP.app.tar.gz" "$TDIR/SLEAP.app" strict

          # 4. The end-to-end question no codesign invocation answers: would
          # Gatekeeper actually let a user open this? Only meaningful once the
          # build is notarized -- an ad-hoc build is expected to be rejected, and
          # that is exactly why scripts/install.sh exists.
          if [ "${SLEAP_SIGNING_MODE:-adhoc}" = developer-id-notarized ]; then
            echo "::group::spctl assessment"
            spctl -a -vvv -t exec "$APP"
            spctl -a -vvv -t open --context context:primary-signature "$DMG"
            echo "::endgroup::"
            # A notarized app must carry a stapled ticket, or a user who is offline
            # (or behind a firewall blocking Apple's OCSP) still gets prompted.
            xcrun stapler validate "$APP"
            echo "Notarized, stapled, and accepted by Gatekeeper."
          else
            echo "All three macOS artifacts carry a valid ad-hoc bundle signature."
            echo "::notice::This build is NOT notarized -- install it with" \
                 "scripts/install.sh, or clear com.apple.quarantine by hand."
          fi

      # Same as build.yml: a mismatched TAURI_SIGNING_PRIVATE_KEY is only a
      # bundler WARNING, so every dev-channel update would silently fail
      # signature verification at install time without this check.
      - name: Verify updater signatures match the configured public key
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, glob, json, os, sys

          def keyid(blob: str) -> str:
              line = next(l for l in blob.splitlines()
                          if l and not l.startswith(("untrusted", "trusted")))
              return base64.b64decode(line)[2:10][::-1].hex().upper()

          conf = json.load(open("src-tauri/tauri.conf.json"))
          want = keyid(base64.b64decode(conf["plugins"]["updater"]["pubkey"]).decode())
          print("configured pubkey key id:", want)

          sigs = sorted(glob.glob("src-tauri/target/**/release/bundle/**/*.sig",
                                  recursive=True))
          if not sigs:
              print("::warning::no .sig files produced; the in-app updater will "
                    "have nothing to verify")
              sys.exit(0)

          bad = []
          for p in sigs:
              got = keyid(base64.b64decode(open(p, "rb").read()).decode())
              print(f"  {os.path.basename(p)}: {got}")
              if got != want:
                  bad.append((p, got))
          if bad:
              for p, got in bad:
                  print(f"::error::{p} was signed with key id {got}, but "
                        f"plugins.updater.pubkey expects {want}; every update "
                        f"would be rejected at runtime")
              sys.exit(1)
          print("All updater signatures match the configured public key.")
          PY

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          B="${{ matrix.bundle-dir }}"
          [ -d "$B" ] || { echo "::error::bundle dir $B does not exist -- did the output path change?"; exit 1; }

          find "$B" -maxdepth 2 -type f ! -name 'rw.*' \( \
            -name '*.dmg' \
            -o -name '*.deb' \
            -o -name '*.rpm' \
            -o -name '*.AppImage' \
            -o -name '*.msi' \
            -o -name '*-setup.exe' \
            -o -name '*.tar.gz' \
            -o -name '*.sig' \
            \) -exec cp {} artifacts/ \;

          ls -lh artifacts/
          count="$(find artifacts -type f | wc -l | tr -d '[:space:]')"
          if [ "$count" -eq 0 ]; then
            echo "::error::no bundles found under $B -- did the bundle output path change?"
            exit 1
          fi
          echo "Collected $count file(s)"

      # Mirrors build.yml's "Add the OS to artifact filenames" -- see there for
      # why the OS goes after the product name, why the .rpm keeps hyphens, and
      # why the suffixes must not change. Kept in step with the release builds
      # on purpose: the dev channel drifting into a second naming convention is
      # exactly the confusion this rename exists to remove.
      - name: Add the OS to artifact filenames
        shell: bash
        env:
          OS_TAG: ${{ matrix.os-tag }}
        run: |
          set -euo pipefail
          cd artifacts
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in
              SLEAP_"$OS_TAG"_* | SLEAP-"$OS_TAG"-* | SLEAP_"$OS_TAG".*) continue ;;
              SLEAP_*) new="SLEAP_${OS_TAG}_${f#SLEAP_}" ;;
              SLEAP-*) new="SLEAP-${OS_TAG}-${f#SLEAP-}" ;;
              SLEAP.*) new="SLEAP_${OS_TAG}.${f#SLEAP.}" ;;
              *)
                echo "::warning::unrecognised artifact name '$f' -- left unrenamed"
                continue
                ;;
            esac
            mv -- "$f" "$new"
            echo "$f -> $new"
          done
          echo "Renamed artifacts:"
          ls -1

      # macOS gets its own human-readable name for this one: it's the only
      # platform where the file a person actually double-clicks (.dmg) and
      # the file Tauri's updater consumes (.app.tar.gz, next step) differ --
      # "-dmg" says what it is without requiring "universal" (arch jargon) to
      # make sense of it. Windows/Linux keep the plain sleap-app-dev-<target>
      # name, since there's nothing to disambiguate there.
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target == 'macos-universal' && 'sleap-app-dev-macos-dmg' || format('sleap-app-dev-{0}', matrix.target) }}
          path: |
            artifacts/*
            !artifacts/*.tar.gz
            !artifacts/*.tar.gz.sig
          # Retention left at the repo default: the dev release itself only
          # ever keeps the SINGLE most recent build (delete + recreate), so
          # this artifact copy is the only place a past dev build survives at
          # all. Not publicly downloadable without a GitHub-authenticated
          # request (Actions artifacts always require auth, even on a public
          # repo -- verified directly, a plain unauthenticated fetch 401s), so
          # this is for a maintainer digging through history, not for handing
          # a tester a link.
          if-no-files-found: error

      # macOS's createUpdaterArtifacts also produces SLEAP.app.tar.gz -- a full
      # second copy of the app in an extractable format the in-app updater
      # needs, alongside the .dmg a human actually double-clicks. Bundling
      # both into one artifact zip roughly doubled its size for anyone who
      # only wanted one of the two (#345). Split out into its own artifact,
      # named the same plain sleap-app-dev-<target> way every other platform's
      # single artifact already is -- this IS the real cross-platform build
      # output (what Tauri's updater actually ships), the .dmg above is the
      # one-time-install extra. `ignore` rather than `error` since
      # Windows/Linux don't produce this format at all today -- when they
      # match zero files, this step uploads nothing under this name, so it
      # never collides with their own (differently-named) installer artifact.
      - name: Upload updater artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sleap-app-dev-${{ matrix.target }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sig
          if-no-files-found: ignore

  # Publishes to a single rolling `dev` pre-release: deleted and
  # recreated every run that actually builds (rather than accumulating assets
  # across runs), so `.../releases/download/dev/latest.json` always
  # reflects whatever commit was last built (not necessarily HEAD of `main`
  # at any given moment, since a quiet night skips the build entirely -- see
  # the `meta` job). See build.yml's `release` job for the per-version-tag
  # equivalent.
  #
  # Requires build to have FULLY succeeded, not merely non-skipped -- unlike
  # build.yml's per-version releases (where a partial-platform release only
  # ever affects that one new version), this release is ROLLING: publishing
  # on a partial matrix failure would DELETE the last good multi-platform
  # dev release and replace it with a regressed one missing whatever
  # platform failed. Better to leave the previous good build in place and
  # let the next successful run supersede it.
  publish:
    needs: [meta, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.meta.outputs.version }}
      SHORT_SHA: ${{ needs.meta.outputs.short_sha }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          path: artifacts
          merge-multiple: true

      - name: Summarize artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ls -lhR artifacts/ || true
          count="$(find artifacts -type f | wc -l | tr -d '[:space:]')"
          if [ "$count" -eq 0 ]; then
            echo "::error::every platform build failed; nothing to publish to the dev channel"
            exit 1
          fi
          # No '*.msi' here on purpose: the Windows leg builds NSIS only (see
          # the matrix comment above), so a missing .msi is expected on every
          # run, not a build failure to warn about.
          for pattern in '*_universal.dmg' '*-setup.exe' '*.deb' '*.AppImage'; do
            if ! find artifacts -name "$pattern" -type f | grep -q .; then
              echo "::warning::this dev build has no $pattern (that platform's build did not succeed)"
            fi
          done

      # Delete-then-recreate is what makes this "rolling": old assets never
      # accumulate, and a stale filename from a prior run can't linger
      # alongside a same-named new one.
      - name: Recreate the dev pre-release
        run: |
          set -euo pipefail
          gh release delete dev --repo "$REPO" --cleanup-tag --yes || true
          # --target pins the tag to the EXACT commit this run built (github.sha),
          # not whatever main's HEAD happens to be when this step runs -- the
          # `meta` job's should_build check on the next run compares against
          # this tag's commit, so it must reflect what was actually built, not
          # a newer commit that raced in after the build started.
          gh release create dev --repo "$REPO" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Dev channel — v$VERSION" \
            --notes "Continuous build from \`main\` @ $SHORT_SHA (run #${{ github.run_number }}). macOS is Developer ID signed and notarized (opens normally, no Gatekeeper override needed); Windows/Linux are unsigned. Built nightly (or on-demand via workflow_dispatch); not a stable release." \
            artifacts/*

      - name: Generate update manifest (latest.json)
        run: |
          set -euo pipefail
          python3 <<'PY'
          import glob, json, os
          from datetime import datetime, timezone

          repo = os.environ["REPO"]
          version = os.environ["VERSION"]
          short_sha = os.environ["SHORT_SHA"]
          base = f"https://github.com/{repo}/releases/download/dev"

          # Same RULES/keys as build.yml's manifest step -- see there for the
          # tauri-plugin-updater key-lookup rationale.
          RULES = [
              (".app.tar.gz.sig",        ["darwin-aarch64-app", "darwin-x86_64-app",
                                          "darwin-aarch64", "darwin-x86_64"]),
              ("-setup.nsis.zip.sig",    ["windows-x86_64-nsis", "windows-x86_64"]),
              ("-setup.exe.sig",         ["windows-x86_64-nsis", "windows-x86_64"]),
              (".msi.zip.sig",           ["windows-x86_64-msi", "windows-x86_64"]),
              (".msi.sig",               ["windows-x86_64-msi", "windows-x86_64"]),
              (".AppImage.tar.gz.sig",   ["linux-x86_64-appimage", "linux-x86_64"]),
              (".AppImage.sig",          ["linux-x86_64-appimage", "linux-x86_64"]),
              (".deb.sig",               ["linux-x86_64-deb"]),
              (".rpm.sig",               ["linux-x86_64-rpm"]),
          ]

          platforms = {}
          for suffix, keys in RULES:
              for sig_path in sorted(glob.glob(f"artifacts/*{suffix}")):
                  artifact = os.path.basename(sig_path)[: -len(".sig")]
                  if not os.path.exists(os.path.join("artifacts", artifact)):
                      print(f"::warning::{artifact} is missing next to its .sig; skipping")
                      continue
                  with open(sig_path) as fh:
                      signature = fh.read().strip()
                  for key in keys:
                      platforms.setdefault(key, {
                          "signature": signature,
                          "url": f"{base}/{artifact}",
                      })

          if not platforms:
              raise SystemExit(
                  "::error::no signed updater artifacts found; refusing to write an "
                  "empty latest.json, which would break the in-app updater"
              )

          manifest = {
              "version": version,
              "notes": f"Continuous build from main @ {short_sha}.",
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }

          with open("latest.json", "w") as fh:
              json.dump(manifest, fh, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload the update manifest to dev
        run: gh release upload dev latest.json --repo "$REPO" --clobber
