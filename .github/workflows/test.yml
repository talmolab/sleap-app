name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # sleap-io.js is being ported to bun too (talmolab/sleap-io.js#130),
      # so build the sibling checkout with bun instead of npm.
      - name: Clone and build sleap-io.js
        run: |
          git clone --depth 1 https://github.com/talmolab/sleap-io.js.git ../sleap-io.js
          cd ../sleap-io.js && bun install --frozen-lockfile && bun run build

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check and build
        run: bun run build

      - name: Run tests
        run: bun test tests/unit
