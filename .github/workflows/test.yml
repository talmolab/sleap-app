name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # sleap-io.js is on bun too and now ships a committed bun.lock
      # (talmolab/sleap-io.js#130, done), so we use --frozen-lockfile for
      # reproducible sibling builds.
      - name: Clone and build sleap-io.js
        run: |
          git clone --depth 1 https://github.com/talmolab/sleap-io.js.git ../sleap-io.js
          cd ../sleap-io.js && bun install --frozen-lockfile && bun run build

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check and build
        run: bun run build

      - name: Type check tests
        run: bun run typecheck:tests

      - name: Run tests
        run: bun run test
