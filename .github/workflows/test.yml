name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # sleap-io.js is being ported to bun too (talmolab/sleap-io.js#130),
      # so build the sibling checkout with bun instead of npm. Use a plain
      # `bun install` (not --frozen-lockfile) until that repo commits an
      # up-to-date bun.lock; bun resolves its deps from package.json.
      - name: Clone and build sleap-io.js
        run: |
          git clone --depth 1 https://github.com/talmolab/sleap-io.js.git ../sleap-io.js
          cd ../sleap-io.js && bun install && bun run build

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check and build
        run: bun run build

      - name: Run tests
        run: bun run test
