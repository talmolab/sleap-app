name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  release:
    types: [published]
  # Manual deploy from the Actions tab (or `gh workflow run deploy.yml`).
  # Pick the target; the selected branch/tag in the run's ref is what gets built.
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        type: choice
        default: dev
        options:
          - dev
          - prod
        required: true

# Serialize deploys to avoid race conditions on gh-pages branch
concurrency:
  group: deploy-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Determine deploy target
        id: target
        run: |
          # A pre-release is a tester build, not a production cut -- it must not
          # replace app.sleap.ai. Send it to /dev/ like a main-branch push.
          if [[ "${{ github.event_name }}" == "release" && "${{ github.event.release.prerelease }}" == "true" ]]; then
            echo "path=dev" >> "$GITHUB_OUTPUT"
            echo "base=/dev/" >> "$GITHUB_OUTPUT"
            echo "label=pre-release ${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "base=/" >> "$GITHUB_OUTPUT"
            echo "label=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.target }}" == "prod" ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "base=/" >> "$GITHUB_OUTPUT"
            echo "label=manual-prod ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "path=dev" >> "$GITHUB_OUTPUT"
            echo "base=/dev/" >> "$GITHUB_OUTPUT"
            echo "label=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_BASE_PATH: ${{ steps.target.outputs.base }}

      # Must run AFTER Build: `vite build` empties dist/ on entry. These live in
      # scripts/ rather than public/ on purpose -- public/ is copied into the
      # frontend bundle that gets embedded in the desktop binary, so an installer
      # in there ships a copy of itself inside the app.
      - name: Stage the install scripts into the site
        run: cp scripts/install.sh scripts/install.ps1 dist/

      - name: Deploy to gh-pages
        run: |
          DEPLOY_PATH="${{ steps.target.outputs.path }}"

          # Set up a fresh clone of just the gh-pages branch
          mkdir gh-pages-dir
          cd gh-pages-dir
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          # Fetch existing gh-pages content, or start fresh
          if git fetch origin gh-pages 2>/dev/null; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
          fi

          # Clean target directory
          if [[ -z "$DEPLOY_PATH" ]]; then
            # Root deploy: remove everything except dev/
            find . -maxdepth 1 \
              ! -name '.' \
              ! -name '.git' \
              ! -name 'dev' \
              -exec rm -rf {} +
          else
            # Dev deploy: remove only dev/
            rm -rf "${DEPLOY_PATH}"
          fi

          # Copy build output
          if [[ -z "$DEPLOY_PATH" ]]; then
            cp -r ../dist/* .
          else
            cp -r ../dist "${DEPLOY_PATH}"
          fi

          # Ensure required files exist
          touch .nojekyll
          echo "app.sleap.ai" > CNAME

          # Commit and push
          git add -A
          git diff --cached --quiet && echo "No changes to deploy" && exit 0
          git commit -m "Deploy ${{ steps.target.outputs.label }} (${GITHUB_SHA::8})"
          git push origin gh-pages
