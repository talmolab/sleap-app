name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  release:
    types: [published]

# Serialize deploys to avoid race conditions on gh-pages branch
concurrency:
  group: deploy-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Determine deploy target
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "base=/" >> "$GITHUB_OUTPUT"
            echo "label=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "path=dev" >> "$GITHUB_OUTPUT"
            echo "base=/dev/" >> "$GITHUB_OUTPUT"
            echo "label=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_BASE_PATH: ${{ steps.target.outputs.base }}

      - name: Deploy to gh-pages
        run: |
          DEPLOY_PATH="${{ steps.target.outputs.path }}"

          # Set up a fresh clone of just the gh-pages branch
          mkdir gh-pages-dir
          cd gh-pages-dir
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          # Fetch existing gh-pages content, or start fresh
          if git fetch origin gh-pages 2>/dev/null; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
          fi

          # Clean target directory
          if [[ -z "$DEPLOY_PATH" ]]; then
            # Root deploy: remove everything except dev/
            find . -maxdepth 1 \
              ! -name '.' \
              ! -name '.git' \
              ! -name 'dev' \
              -exec rm -rf {} +
          else
            # Dev deploy: remove only dev/
            rm -rf "${DEPLOY_PATH}"
          fi

          # Copy build output
          if [[ -z "$DEPLOY_PATH" ]]; then
            cp -r ../dist/* .
          else
            cp -r ../dist "${DEPLOY_PATH}"
          fi

          # Ensure required files exist
          touch .nojekyll
          echo "app.sleap.ai" > CNAME

          # Commit and push
          git add -A
          git diff --cached --quiet && echo "No changes to deploy" && exit 0
          git commit -m "Deploy ${{ steps.target.outputs.label }} (${GITHUB_SHA::8})"
          git push origin gh-pages
