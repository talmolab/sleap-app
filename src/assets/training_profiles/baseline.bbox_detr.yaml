data_config:
  train_labels_path: null
  val_labels_path: null
  validation_fraction: 0.1
  test_file_path: null
  provider: LabelsReader
  user_instances_only: true
  data_pipeline_fw: torch_dataset_cache_img_memory
  cache_img_path: null
  use_existing_imgs: false
  delete_cache_imgs_after_training: true
  preprocessing:
    ensure_rgb: true
    ensure_grayscale: false
    max_height: 576
    max_width: 576
    scale: 1.0
    crop_size: null
    min_crop_size: 100
  use_augmentations_train: true
  augmentation_config:
    intensity:
      uniform_noise_min: 0
      uniform_noise_max: 1
      uniform_noise_p: 0
      gaussian_noise_mean: 5
      gaussian_noise_std: 1
      gaussian_noise_p: 0
      contrast_min: 0.5
      contrast_max: 2
      contrast_p: 0
      brightness_min: 0
      brightness_max: 2
      brightness_p: 0
    geometric:
      rotation_min: 0
      rotation_max: 0
      scale_min: 0.9
      scale_max: 1.1
      translate_width: 0
      translate_height: 0
      affine_p: 1
      erase_scale_min: 0.0001
      erase_scale_max: 0.01
      erase_ratio_min: 1
      erase_ratio_max: 1
      erase_p: 0
      mixup_lambda_min: 0.01
      mixup_lambda_max: 0.05
      mixup_p: 0
  skeletons: null
  bbox_source: auto
  bbox_padding: 0
model_config:
  init_weights: default
  pretrained_backbone_weights: null
  pretrained_head_weights: null
  backbone_config:
    unet: null
    convnext: null
    swint: null
    pretrained: null
    dinov2_windowed:
      in_channels: 3
      hidden_size: 384
      num_layers: 12
      num_heads: 6
      mlp_ratio: 4.0
      patch_size: 16
      pos_embed_grid: 36
      out_indices:
        - 3
        - 6
        - 9
        - 12
      num_windows: 2
      window_block_indexes: null
      drop_path_rate: 0.0
      weights: facebook/dinov2-small
      revision: null
      output_stride: 16
      max_stride: 32
  head_configs:
    single_instance: null
    centroid: null
    centered_instance: null
    bottomup: null
    multi_class_bottomup: null
    multi_class_topdown: null
    bbox_detr:
      detr:
        categories: null
        output_stride: 16
        hidden_dim: 256
        num_queries: 300
        group_detr: 13
        dec_layers: 3
        sa_nheads: 8
        ca_nheads: 16
        dec_n_points: 2
        dim_feedforward: 2048
        dropout: 0.0
        c2f_num_blocks: 3
        c2f_expansion: 0.5
        num_select: 300
        cls_loss_coef: 1.0
        bbox_loss_coef: 5.0
        giou_loss_coef: 2.0
        set_cost_class: 2.0
        set_cost_bbox: 5.0
        set_cost_giou: 2.0
        focal_alpha: 0.25
        focal_gamma: 2.0
        lr_component_decay: 0.7
  total_params: null
trainer_config:
  train_data_loader:
    batch_size: 4
    shuffle: true
    num_workers: 2
  val_data_loader:
    batch_size: 4
    shuffle: false
    num_workers: 2
  model_ckpt:
    save_top_k: 1
    save_last: false
  trainer_devices: null
  trainer_device_indices: null
  trainer_accelerator: auto
  profiler: null
  trainer_strategy: auto
  enable_progress_bar: true
  min_train_steps_per_epoch: 200
  train_steps_per_epoch: null
  visualize_preds_during_training: true
  keep_viz: false
  max_epochs: 100
  seed: null
  use_wandb: false
  save_ckpt: true
  ckpt_dir: models
  run_name: null
  resume_ckpt_path: null
  wandb:
    entity: null
    project: null
    name: null
    save_viz_imgs_wandb: false
    api_key: null
    wandb_mode: null
    prv_runid: null
    group: null
    current_run_id: null
  optimizer_name: AdamW
  optimizer:
    lr: 0.0001
    amsgrad: false
  lr_scheduler:
    step_lr: null
    reduce_lr_on_plateau:
      threshold: 0.000001
      threshold_mode: abs
      cooldown: 3
      patience: 5
      factor: 0.5
      min_lr: 1.e-8
  early_stopping:
    min_delta: 1.e-8
    patience: 10
    stop_training_on_plateau: true
  online_hard_keypoint_mining:
    online_mining: false
    hard_to_easy_ratio: 2
    min_hard_keypoints: 2
    max_hard_keypoints: null
    loss_scale: 5
  zmq:
    controller_port: 9000
    controller_polling_timeout: 10
    publish_port: 9001
  eval:
    enabled: true
    frequency: 1
name: ''
description: ''
sleap_nn_version: 0.4.0a0
