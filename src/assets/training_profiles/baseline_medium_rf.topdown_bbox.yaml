data_config:
  train_labels_path: null
  val_labels_path: null
  validation_fraction: 0.1
  test_file_path: null
  provider: LabelsReader
  user_instances_only: true
  data_pipeline_fw: torch_dataset_cache_img_memory
  cache_img_path: null
  use_existing_imgs: false
  delete_cache_imgs_after_training: true
  preprocessing:
    ensure_rgb: false
    ensure_grayscale: false
    max_height: null
    max_width: null
    scale: 1
    crop_size: null
    min_crop_size: 100
    crop_mode: bbox
    crop_bbox_aspect: square
    crop_bbox_padding: 0.1
    crop_bbox_min_size: null
  use_augmentations_train: true
  augmentation_config:
    intensity:
      uniform_noise_min: 0
      uniform_noise_max: 1
      uniform_noise_p: 0
      gaussian_noise_mean: 5
      gaussian_noise_std: 1
      gaussian_noise_p: 0
      contrast_min: 0.5
      contrast_max: 2
      contrast_p: 0
      brightness_min: 0
      brightness_max: 2
      brightness_p: 0
    geometric:
      rotation_min: -180
      rotation_max: 180
      scale_min: 0.9
      scale_max: 1.1
      translate_width: 0
      translate_height: 0
      affine_p: 1
      erase_scale_min: 0.0001
      erase_scale_max: 0.01
      erase_ratio_min: 1
      erase_ratio_max: 1
      erase_p: 0
      mixup_lambda_min: 0.01
      mixup_lambda_max: 0.05
      mixup_p: 0
  skeletons: null
  bbox_source: auto
  bbox_padding: 0
model_config:
  init_weights: default
  pretrained_backbone_weights: null
  pretrained_head_weights: null
  backbone_config:
    unet:
      in_channels: 1
      kernel_size: 3
      filters: 24
      filters_rate: 2
      max_stride: 16
      stem_stride: null
      middle_block: true
      up_interpolate: true
      stacks: 1
      convs_per_block: 2
      output_stride: 4
    convnext: null
    swint: null
  head_configs:
    single_instance: null
    centroid: null
    centered_instance:
      confmaps:
        part_names: null
        anchor_part: null
        sigma: 2.5
        output_stride: 4
        loss_weight: 1
    bottomup: null
    multi_class_bottomup: null
    multi_class_topdown: null
  total_params: null
trainer_config:
  train_data_loader:
    batch_size: 4
    shuffle: true
    num_workers: 2
  val_data_loader:
    batch_size: 4
    shuffle: false
    num_workers: 2
  model_ckpt:
    save_top_k: 1
    save_last: false
  trainer_devices: null
  trainer_device_indices: null
  trainer_accelerator: auto
  profiler: null
  trainer_strategy: auto
  enable_progress_bar: true
  min_train_steps_per_epoch: 200
  train_steps_per_epoch: null
  visualize_preds_during_training: true
  keep_viz: false
  max_epochs: 200
  seed: null
  use_wandb: false
  save_ckpt: true
  ckpt_dir: models
  run_name: null
  resume_ckpt_path: null
  wandb:
    entity: null
    project: null
    name: null
    save_viz_imgs_wandb: false
    api_key: null
    wandb_mode: null
    prv_runid: null
    group: null
    current_run_id: null
  optimizer_name: Adam
  optimizer:
    lr: 0.0001
    amsgrad: false
  lr_scheduler:
    step_lr: null
    reduce_lr_on_plateau:
      threshold: 0.000001
      threshold_mode: abs
      cooldown: 3
      patience: 5
      factor: 0.5
      min_lr: 1.e-8
  early_stopping:
    min_delta: 1.e-8
    patience: 10
    stop_training_on_plateau: true
  online_hard_keypoint_mining:
    online_mining: false
    hard_to_easy_ratio: 2
    min_hard_keypoints: 2
    max_hard_keypoints: null
    loss_scale: 5
  zmq:
    controller_port: 9000
    controller_polling_timeout: 10
    publish_port: 9001
name: ''
description: ''
sleap_nn_version: 0.0.1
filename: ''
