[package]
name = "sleap-app"
version = "0.1.0"
description = "SLEAP - desktop shell"
authors = ["SLEAP"]
license = "BSD-3-Clause"
repository = "https://github.com/talmolab/sleap-app"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Dev-only UI automation bridge. Lets the `tauri-pilot` CLI inspect and drive
# the WebView (see CLAUDE.md → "Driving the desktop GUI"). `init()` is a no-op
# in release builds, so it never ships in the production app. Requires the
# build toolchain to be Rust 1.95+ (the crate uses edition 2024).
#
# Uses the crates.io release. (Background: 0.6.0 panicked at startup on Windows
# — "there is no reactor running, must be called from the context of a Tokio
# 1.x runtime" — because it bound its named pipe in the synchronous `setup`
# hook. That was fixed upstream in #115, and 0.7.0 also restored eval on the
# Windows / Linux WebViews (#110). Both fixes shipped in 0.7.0, so the old
# git-commit pin is no longer needed.)
tauri-plugin-pilot = "0.7.0"

libc = "0.2"

# WebRTC (native P2P, bypasses webview mDNS restriction)
webrtc = "0.17"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
tokio = { version = "1", features = ["sync", "time", "macros"] }
futures-util = "0.3"
urlencoding = "2"
dirs = "6"
