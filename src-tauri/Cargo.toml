[package]
name = "sleap-app"
version = "0.1.0"
description = "SLEAP - desktop shell"
authors = ["SLEAP"]
license = "BSD-3-Clause"
repository = "https://github.com/talmolab/sleap-app"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Dev-only UI automation bridge. Lets the `tauri-pilot` CLI inspect and drive
# the WebView (see CLAUDE.md → "Driving the desktop GUI"). `init()` is a no-op
# in release builds, so it never ships in the production app. Requires the
# build toolchain to be Rust 1.95+ (the crate uses edition 2024).
#
# Pinned to a git commit, NOT crates.io: the published 0.6.0 panics at startup
# on Windows ("there is no reactor running, must be called from the context of
# a Tokio 1.x runtime") because it binds its named pipe in the synchronous
# `setup` hook. The fix (upstream #115) is on `main` but unreleased. Switch to a
# crates.io version once a release > 0.6.0 ships with the fix.
tauri-plugin-pilot = { git = "https://github.com/mpiton/tauri-pilot", rev = "f1d67f2d40339b8d6d9d6ca9c258ecaffd3c3305" }

libc = "0.2"

# WebRTC (native P2P, bypasses webview mDNS restriction)
webrtc = "0.17"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
tokio = { version = "1", features = ["sync", "time", "macros"] }
futures-util = "0.3"
urlencoding = "2"
dirs = "6"
